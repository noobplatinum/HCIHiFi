<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Roadmaply — AI Career Roadmap Builder</title>
  <meta name="description" content="Roadmaply is an AI-powered career roadmap picker, learning guide, and job seeker platform. Build your personalized career path today."/>

  <!-- TailwindCSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- Google Fonts: Manrope -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'primary':        '#2563eb',
            'primary-dark':   '#1d4ed8',
            'primary-light':  '#dbeafe',
            'bg-base':        '#f8fafc',
            'surface':        '#ffffff',
            'text-main':      '#1e293b',
            'text-muted':     '#64748b',
            'border-base':    '#e2e8f0',
            'success':        '#16a34a',
            'warning':        '#f59e0b',
            'danger':         '#ef4444',
          },
          fontFamily: {
            display: ['Manrope', 'sans-serif'],
          },
          borderRadius: {
            'DEFAULT': '0.25rem',
            'lg': '0.5rem',
            'xl': '0.75rem',
            '2xl': '1rem',
            'full': '9999px',
          },
          boxShadow: {
            'card': '0 2px 10px -3px rgba(6,81,237,0.1)',
            'card-hover': '0 8px 30px -6px rgba(6,81,237,0.2)',
          },
        },
      },
    };
  </script>

  <style>
    /* Base resets */
    * { box-sizing: border-box; }
    body { font-family: 'Manrope', sans-serif; }

    /* Material Symbols sizing helper */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      user-select: none;
    }

    /* Page transition */
    #app { animation: pageFadeIn 0.25s ease; }
    @keyframes pageFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 0.8s linear infinite; display: inline-block; }

    /* Fade-in util */
    .fade-in { animation: pageFadeIn 0.3s ease; }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Toast container */
    #toast-container {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      min-width: 260px;
      max-width: 360px;
      padding: 0.875rem 1.25rem;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.625rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      animation: toastIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      transition: all 0.25s ease;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(40px) scale(0.9); }
      to   { opacity: 1; transform: translateX(0) scale(1); }
    }
    .toast.out {
      animation: toastOut 0.25s ease forwards;
    }
    @keyframes toastOut {
      to { opacity: 0; transform: translateX(40px) scale(0.9); }
    }
    .toast-success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    .toast-info    { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
    .toast-warning { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
    .toast-error   { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }

    /* Progress bar fill animation */
    .progress-fill { transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }

    /* Pulse loading animation */
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading-pulse { animation: pulse 1.5s ease-in-out infinite; }
  </style>
</head>
<body class="bg-bg-base font-display text-text-main min-h-screen flex flex-col selection:bg-primary selection:text-white">

  <!-- Toast container (always present) -->
  <div id="toast-container"></div>

  <!-- SPA mount point -->
  <div id="app"></div>

  <!-- Core modules -->
  <script type="module" src="data/mock-data.js"></script>
  <script type="module" src="components/toast.js"></script>
  <script type="module" src="components/navbar.js"></script>
  <script type="module" src="app.js"></script>

</body>
</html>
